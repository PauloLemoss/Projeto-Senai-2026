services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercado}
      POSTGRES_DB: ${POSTGRES_DB:-mercado_jogadores}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercado}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
